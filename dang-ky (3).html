<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8c8d8">
<title>Dermaxilic – RCD 2026 Registration / Đăng ký</title>
<style>
  :root {
    --pink: #f8c8d8; --pink-soft: #fdeef3; --rose: #a8375f; --rose-dark: #82284a;
    --text: #3b2531; --muted: #7d6570; --line: #efd3de; --card: #ffffff;
    --err: #b3261e; --err-bg: #fdecea; --ok: #1f7a43;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--text); background: var(--pink-soft);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .hero { background: var(--pink); padding: 28px 16px 56px; text-align: center; }
  .brand { font-size: 26px; font-weight: 800; letter-spacing: .14em; color: var(--rose-dark); margin: 0; }
  .event { margin: 4px 0 0; font-size: 14px; color: var(--rose-dark); opacity: .85; }
  .hero h1 { margin: 16px 0 4px; font-size: 20px; line-height: 1.3; }
  .hero p { margin: 0; font-size: 14px; color: var(--muted); }
  main { max-width: 520px; margin: -36px auto 0; padding: 0 16px 40px; position: relative; z-index: 1; }
  .card { background: var(--card); border-radius: 18px; padding: 18px 16px; margin-bottom: 14px;
          box-shadow: 0 2px 10px rgba(168, 55, 95, .08); }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label, .label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .req { color: var(--rose); }
  .opt { color: var(--muted); font-weight: 400; font-size: 13px; }
  input[type=text], input[type=tel], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); padding: 13px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
    -webkit-appearance: none; appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--rose) 50%), linear-gradient(135deg, var(--rose) 50%, transparent 50%);
           background-position: calc(100% - 20px) 52%, calc(100% - 15px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  input:focus, select:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px rgba(168,55,95,.15); }
  .invalid { border-color: var(--err) !important; background: var(--err-bg) !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { position: absolute; opacity: 0; width: 1px; pointer-events: none; }
  .chips label { margin: 0; font-weight: 500; font-size: 15px; padding: 10px 14px; border-radius: 999px;
                 border: 1.5px solid var(--line); background: #fff; cursor: pointer; user-select: none; }
  .chips input:checked + label { background: var(--rose); border-color: var(--rose); color: #fff; }
  .chips input:focus-visible + label { outline: 2px solid var(--rose); outline-offset: 2px; }
  .chips.invalid { border-radius: 14px; outline: 1.5px solid var(--err); outline-offset: 5px; background: transparent !important; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
  .consent input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--rose); flex: none; }
  .consent.invalid { background: var(--err-bg) !important; border-radius: 10px; padding: 8px; color: var(--err); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button.submit { width: 100%; font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--rose);
                  border: 0; border-radius: 14px; padding: 15px; cursor: pointer; }
  button.submit:disabled { opacity: .6; }
  .msg { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600;
         background: var(--err-bg); color: var(--err); }
  .msg.show { display: block; }
  .social { display: grid; gap: 10px; }
  .social a { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
              font-weight: 700; font-size: 16px; padding: 13px; border-radius: 14px; }
  .social a.tiktok { background: #111; color: #fff; }
  .social a.page { background: #fff; color: var(--rose-dark); border: 1.5px solid var(--rose); }
  .social svg { width: 20px; height: 20px; flex: none; }
  .social-title { text-align: center; font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .done { display: none; text-align: center; }
  .done.show { display: block; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--pink); color: var(--rose-dark);
                display: grid; place-items: center; font-size: 34px; margin: 4px auto 10px; }
  .done h2 { margin: 0 0 6px; font-size: 20px; }
  .done p { margin: 0 0 16px; color: var(--muted); }
  .lang { position: absolute; top: 12px; right: max(12px, calc(50% - 260px)); display: flex; gap: 2px; background: rgba(255,255,255,.55);
          border-radius: 999px; padding: 3px; }
  .lang button { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: transparent; color: var(--rose-dark);
                 padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .lang button.on { background: var(--rose); color: #fff; }
  .hero { position: relative; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 16px 24px; }
</style>
</head>
<body>
<div class="hero">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang_vi" data-lang="vi">VI</button>
    <button type="button" id="lang_en" data-lang="en">EN</button>
  </div>
  <p class="brand">DERMAXILIC</p>
  <p class="event" data-i18n="event"></p>
  <h1 data-i18n="title"></h1>
  <p data-i18n="sub"></p>
</div>

<main>
  <form id="f" novalidate autocomplete="on">
    <section class="card" id="formCard">
      <div class="field">
        <label for="name"><span data-i18n="name"></span> <span class="req">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" data-i18n-ph="name_ph">
      </div>
      <div class="field">
        <label for="phone"><span data-i18n="phone"></span> <span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" data-i18n-ph="phone_ph">
      </div>
      <div class="field">
        <span class="label"><span data-i18n="group"></span> <span class="req">*</span></span>
        <div class="chips" id="group"></div>
      </div>
      <div class="field">
        <span class="label"><span data-i18n="type"></span> <span class="req">*</span></span>
        <div class="chips" id="type">
          <input type="radio" name="type" id="type_new" value="Mới"><label for="type_new" data-i18n="type_new"></label>
          <input type="radio" name="type" id="type_old" value="Cũ"><label for="type_old" data-i18n="type_old"></label>
        </div>
      </div>
      <div class="field">
        <label for="org"><span data-i18n="org"></span> <span class="opt" data-i18n="optional"></span></label>
        <input type="text" id="org" name="org" autocomplete="organization">
      </div>
      <div class="row2">
        <div class="field">
          <label for="title"><span data-i18n="jobtitle"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="text" id="title" name="title" autocomplete="organization-title">
        </div>
        <div class="field">
          <label for="city"><span data-i18n="city"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="text" id="city" name="city" autocomplete="address-level1">
        </div>
      </div>
      <div class="field">
        <span class="label"><span data-i18n="need"></span> <span class="opt" data-i18n="multi"></span></span>
        <div class="chips" id="need">
          <input type="checkbox" name="need" id="need_1" value="Sản phẩm cho phòng khám"><label for="need_1" data-i18n="need_1"></label>
          <input type="checkbox" name="need" id="need_2" value="Nhập hàng / phân phối"><label for="need_2" data-i18n="need_2"></label>
          <input type="checkbox" name="need" id="need_3" value="Hợp tác KOL/KOC"><label for="need_3" data-i18n="need_3"></label>
          <input type="checkbox" name="need" id="need_4" value="Đào tạo chuyên môn"><label for="need_4" data-i18n="need_4"></label>
          <input type="checkbox" name="need" id="need_5" value="Mua dùng cá nhân"><label for="need_5" data-i18n="need_5"></label>
        </div>
      </div>
      <div class="field">
        <label for="sale"><span data-i18n="sale"></span> <span class="opt" data-i18n="ifany"></span></label>
        <select id="sale" name="sale"></select>
      </div>
      <div class="field">
        <label class="consent" id="consentBox">
          <input type="checkbox" id="consent">
          <span><span data-i18n="consent"></span> <span class="req">*</span></span>
        </label>
      </div>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <button type="button" class="submit" id="submit" data-i18n="submit"></button>
      <div class="msg" id="msg" role="alert"></div>
    </section>

    <section class="card done" id="doneCard">
      <div class="tick">✓</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
    </section>

    <section class="card">
      <p class="social-title" data-i18n="follow"></p>
      <div class="social" id="social"></div>
    </section>
  </form>
</main>
<footer>© Dermaxilic · RCD 2026</footer>

<script>
/* ====== CẤU HÌNH ====== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwgeRwmP2GQhsHTgF0BCAkdo3KknfDpQyXdJtbKO38lgD4QeAJaz7PibpJ05arq2izg4Q/exec';
const API_KEY = 'rcd2026-dermaxilic';
const TIKTOK_URL = 'https://www.tiktok.com/@dermaxilic.official';
const PAGE_URL = 'https://www.facebook.com/share/1DwxbZvAPp/?mibextid=wwXIfr'; // Dán link Fanpage Dermaxilic vào đây (để trống thì nút Fanpage tự ẩn)
/* ====================== */

// Giá trị gửi về Sheet luôn là tiếng Việt (value); chỉ nhãn hiển thị đổi theo ngôn ngữ
const GROUPS = [
  { value: 'Bác sĩ', vi: 'Bác sĩ', en: 'Doctor' },
  { value: 'NPP / Đại lý', vi: 'Nhà phân phối / Đại lý / Nhà thuốc', en: 'Distributor / Agent / Pharmacy' },
  { value: 'Khác', vi: 'Khác', en: 'Other' }
];
const I18N = {
  vi: {
    event: 'Hội nghị Da liễu RCD 2026', title: 'Đăng ký nhận tư vấn & ưu đãi tại booth', sub: 'Chỉ mất khoảng 1 phút',
    name: 'Họ và tên', name_ph: 'VD: Nguyễn Văn A', phone: 'Số điện thoại', phone_ph: 'VD: 0912 345 678 hoặc +82 10 1234 5678',
    group: 'Bạn là', type: 'Bạn đã từng dùng sản phẩm Dermaxilic chưa?', type_new: 'Chưa, lần đầu biết', type_old: 'Đã từng dùng',
    org: 'Phòng khám / Nhà thuốc / Đơn vị', jobtitle: 'Chức danh', city: 'Tỉnh/Thành', optional: '(không bắt buộc)',
    need: 'Bạn quan tâm đến', multi: '(chọn nhiều)', need_1: 'Sản phẩm cho phòng khám', need_2: 'Nhập hàng / phân phối',
    need_3: 'Hợp tác KOL/KOC', need_4: 'Đào tạo chuyên môn', need_5: 'Mua dùng cá nhân',
    sale: 'Tư vấn viên đang hỗ trợ bạn', ifany: '(nếu có)', sale_none: 'Chưa có / Không nhớ tên',
    consent: 'Tôi đồng ý để Dermaxilic lưu thông tin trên và liên hệ tư vấn, gửi thông tin sản phẩm cho tôi.',
    submit: 'Gửi đăng ký', follow: 'Theo dõi Dermaxilic để cập nhật kiến thức & ưu đãi', page_btn: 'Fanpage DERMAXILIC',
    done_title: 'Cảm ơn bạn đã đăng ký!', saving: 'Đang lưu thông tin…', done_text: 'Đội ngũ Dermaxilic sẽ liên hệ tư vấn cho bạn sớm.',
    dup_title: 'Bạn đã đăng ký trước đó rồi!', dup_text: 'Thông tin của bạn đã có trong hệ thống. Dermaxilic sẽ liên hệ bạn sớm.',
    missing: 'Vui lòng bổ sung: ', m_name: 'Họ và tên', m_phone: 'Số điện thoại hợp lệ (7–15 chữ số, số nước ngoài thêm mã quốc gia, VD +82…)',
    m_group: 'Bạn là', m_type: 'Đã dùng sản phẩm chưa', m_consent: 'Đồng ý lưu thông tin',
    fail: 'Gửi chưa thành công, bạn kiểm tra kết nối mạng rồi bấm Gửi lại nhé.'
  },
  en: {
    event: 'RCD 2026 Dermatology Conference', title: 'Register for a consultation & booth offers', sub: 'Takes about 1 minute',
    name: 'Full name', name_ph: 'e.g. John Smith', phone: 'Phone number', phone_ph: 'e.g. +82 10 1234 5678',
    group: 'You are a', type: 'Have you used Dermaxilic products before?', type_new: 'No, first time', type_old: 'Yes, I have',
    org: 'Clinic / Pharmacy / Organization', jobtitle: 'Job title', city: 'City / Country', optional: '(optional)',
    need: 'I am interested in', multi: '(select all that apply)', need_1: 'Products for my clinic', need_2: 'Wholesale / distribution',
    need_3: 'KOL/KOC partnership', need_4: 'Professional training', need_5: 'Personal use',
    sale: 'Consultant assisting you', ifany: '(if any)', sale_none: 'None / Not sure',
    consent: 'I agree that Dermaxilic may store the information above and contact me with consultations and product updates.',
    submit: 'Submit', follow: 'Follow Dermaxilic for skincare tips & offers', page_btn: 'DERMAXILIC Fanpage',
    done_title: 'Thank you for registering!', saving: 'Saving your information…', done_text: 'The Dermaxilic team will contact you soon.',
    dup_title: 'You have already registered!', dup_text: 'Your information is already in our system. Dermaxilic will contact you soon.',
    missing: 'Please complete: ', m_name: 'Full name', m_phone: 'Valid phone number (7–15 digits, include country code, e.g. +82…)',
    m_group: 'You are a', m_type: 'Used products before', m_consent: 'Consent to store information',
    fail: 'Submission failed. Please check your connection and tap Submit again.'
  }
};
let LANG = 'vi';
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.vi[k] || k;
function setLang(l) {
  LANG = I18N[l] ? l : 'vi';
  try { localStorage.setItem('rcd_lang', LANG); } catch (e) {}
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  renderGroups(); renderSales(); renderSocial();
}
let SALES = [
  'Trần Phương Linh (Linh lớn)', 'Nguyễn Thị Huyền', 'Dương Khánh Ly', 'Nguyễn Vân Anh', 'Nguyễn Phương Hà My',
  'Nguyễn Phương Linh (Linh bé)', 'Nguyễn Thị Ngát', 'Đỗ Hà Ngân', 'Vũ Thị Mai'
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderGroups() {
  const cur = checked('group');
  $('group').innerHTML = GROUPS.map((g, i) =>
    `<input type="radio" name="group" id="group_${i}" value="${esc(g.value)}"${g.value === cur ? ' checked' : ''}><label for="group_${i}">${esc(g[LANG] || g.vi)}</label>`).join('');
}
function renderSales() {
  const cur = $('sale').value;
  $('sale').innerHTML = `<option value="">${esc(t('sale_none'))}</option>` +
    SALES.map(n => `<option${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
}
function renderSocial() {
  const tiktokIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg>';
  const pageIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14A28.6 28.6 0 0 0 14.6 2C11.9 2 10 3.66 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>';
  let html = `<a class="tiktok" href="${esc(TIKTOK_URL)}" target="_blank" rel="noopener">${tiktokIcon}TikTok @dermaxilic.official</a>`;
  if (PAGE_URL) html += `<a class="page" href="${esc(PAGE_URL)}" target="_blank" rel="noopener">${pageIcon}${esc(t('page_btn'))}</a>`;
  $('social').innerHTML = html;
}

async function loadSales() {
  try {
    const r = await fetch(`${WEB_APP_URL}?action=config&key=${encodeURIComponent(API_KEY)}`);
    const c = await r.json();
    if (c.ok && c.sales && c.sales.length) { SALES = c.sales.map(s => s.name); renderSales(); }
  } catch (e) { /* dùng danh sách có sẵn */ }
}

// Giữ dấu + ở đầu (số nước ngoài), bỏ khoảng trắng, chấm, gạch, ngoặc; "00xx" -> "+xx"
function cleanPhone(s) {
  s = String(s || '').trim().replace(/[\s.\-()]/g, '');
  if (s.startsWith('00')) s = '+' + s.slice(2);
  return s;
}
function checked(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; }

function collect() {
  const v = (id) => $(id).value.trim();
  return {
    key: API_KEY, source: 'khach', website: v('website'),
    name: v('name'), phone: cleanPhone(v('phone')),
    group: checked('group'), type: checked('type'),
    org: v('org'), title: v('title'), city: v('city'),
    need: [...document.querySelectorAll('input[name="need"]:checked')].map(x => x.value).join(', '),
    sale: v('sale'), consent: $('consent').checked
  };
}

function showMsg(t) { const m = $('msg'); m.textContent = t; m.classList.add('show'); }

function validate(d) {
  document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
  const miss = [];
  if (!d.name) { miss.push(t('m_name')); $('name').classList.add('invalid'); }
  if (!/^\+?\d{7,15}$/.test(d.phone)) { miss.push(t('m_phone')); $('phone').classList.add('invalid'); }
  if (!d.group) { miss.push(t('m_group')); $('group').classList.add('invalid'); }
  if (!d.type) { miss.push(t('m_type')); $('type').classList.add('invalid'); }
  if (!d.consent) { miss.push(t('m_consent')); $('consentBox').classList.add('invalid'); }
  return miss;
}

async function submit() {
  $('msg').classList.remove('show');
  const d = collect();
  const miss = validate(d);
  if (miss.length) { showMsg(t('missing') + miss.join(', ')); return; }

  // Hiện màn hình cảm ơn ngay, gửi dữ liệu ngầm phía sau
  const btn = $('submit');
  btn.disabled = true;
  $('formCard').style.display = 'none';
  $('doneCard').classList.add('show');
  $('doneTitle').textContent = t('done_title');
  $('doneText').textContent = t('saving');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    const r = await fetch(WEB_APP_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'Không gửi được');
    if (res.duplicate) {
      $('doneTitle').textContent = t('dup_title');
      $('doneText').textContent = t('dup_text');
    } else {
      $('doneText').textContent = t('done_text');
    }
  } catch (e) {
    // Gửi lỗi: quay lại phiếu, giữ nguyên thông tin để bấm Gửi lại
    $('doneCard').classList.remove('show');
    $('formCard').style.display = '';
    const detail = e && e.message && e.message !== 'Failed to fetch' ? ' (' + e.message + ')' : '';
    showMsg(t('fail') + detail);
    $('msg').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } finally {
    btn.disabled = false;
  }
}

let savedLang = 'vi';
try { savedLang = localStorage.getItem('rcd_lang') || (navigator.language && !navigator.language.toLowerCase().startsWith('vi') ? 'en' : 'vi'); } catch (e) {}
setLang(savedLang); loadSales();
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.addEventListener('change', e => {
  const t = e.target; if (!t.closest) return;
  t.classList.remove('invalid');
  const box = t.closest('.chips, .consent'); if (box) box.classList.remove('invalid');
});
$('submit').addEventListener('click', submit);
</script>
</body>
</html>
